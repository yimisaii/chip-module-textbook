<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">外设数据与事件路径示意</title>
  <desc id="desc">数据从输入经过外设到输出。控制和状态用不同方向的虚线表示。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="250" fill="#fff"/>
  <g fill="#f4f4f4" stroke="#222" stroke-width="2">
    <rect x="40" y="123" width="170" height="64" rx="8"/>
    <rect x="305" y="123" width="190" height="64" rx="8"/>
    <rect x="590" y="123" width="170" height="64" rx="8"/>
    <rect x="305" y="23" width="190" height="50" rx="8"/>
  </g>
  <g fill="#222" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="21">
    <text x="125" y="162">输入</text>
    <text x="400" y="162">外设模块</text>
    <text x="675" y="162">输出</text>
    <text x="400" y="55">处理器</text>
  </g>
  <g fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)">
    <path d="M210 155 H300"/>
    <path d="M495 155 H585"/>
    <path d="M367 73 V118" stroke-dasharray="6 4"/>
    <path d="M433 123 V78" stroke-dasharray="6 4"/>
  </g>
  <g fill="#222" font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="16">
    <text x="318" y="105">控制</text>
    <text x="448" y="105">状态</text>
    <text x="40" y="225">实线表示数据方向，虚线表示控制或状态。图为原理示意。</text>
  </g>
</svg>
