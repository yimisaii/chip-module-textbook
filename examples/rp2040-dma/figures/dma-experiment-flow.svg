<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">RP2040 DMA 轮询实验的状态判定</title>
  <desc id="desc">先检查 AHB 错误，其次判定忙标志和剩余计数。确认正常完成后比较目标数据。超时或错误转入终止和保留现场。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0,0 L 8,4 L 0,8 z" fill="#171717"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#171717" text-anchor="middle">
    <rect width="1000" height="540" fill="#fff"/>
    <g stroke="#171717" stroke-width="2" fill="#fff">
      <rect x="340" y="20" width="320" height="62" rx="8" fill="#f2f2f2"/>
      <rect x="340" y="142" width="320" height="66" rx="8"/>
      <rect x="340" y="273" width="320" height="67" rx="8"/>
      <rect x="340" y="415" width="320" height="76" rx="8" fill="#f2f2f2"/>
      <rect x="721" y="219" width="251" height="92" rx="8" fill="#f2f2f2"/>
      <rect x="28" y="267" width="230" height="80" rx="8"/>
    </g>
    <g stroke="#171717" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
      <path d="M 500,82 V 140"/>
      <path d="M 500,208 V 271"/>
      <path d="M 500,340 V 413"/>
      <path d="M 660,175 H 847 V 217"/>
      <path d="M 660,306 H 719"/>
      <path d="M 340,307 H 260"/>
      <path d="M 143,267 V 175 H 338"/>
    </g>
    <text x="500" y="59" font-weight="bold">初始化数组并启动 DMA</text>
    <text x="500" y="182">有 AHB 总线错误？</text>
    <text x="500" y="300">检查 BUSY、剩余计数</text>
    <text x="500" y="328">和等待期限</text>
    <text x="500" y="446" font-weight="bold">逐项比较 64 个元素</text>
    <text x="500" y="474" font-size="20">记录 PASS 或首处差异</text>
    <text x="846" y="254" font-weight="bold">保留故障状态</text>
    <text x="846" y="283" font-size="20">请求终止，等待退出</text>
    <text x="143" y="316">继续轮询</text>
    <text x="534" y="247" font-size="19">无</text>
    <text x="735" y="161" font-size="19">有</text>
    <text x="688" y="365" font-size="19">超时或计数异常</text>
    <text x="612" y="386" font-size="19">空闲且计数为 0</text>
    <text x="293" y="369" font-size="19">仍忙且未超时</text>
  </g>
</svg>
