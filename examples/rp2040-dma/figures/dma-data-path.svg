<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">RP2040 SRAM 到 SRAM 的 DMA 数据通路</title>
  <desc id="desc">CPU 配置并启动一个 DMA 通道，同时轮询状态。DMA 从源 SRAM 数组读取 64 个 32 位元素，并写入目标 SRAM 数组。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M 0,0 L 8,4 L 0,8 z" fill="#171717"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#171717" text-anchor="middle">
    <rect width="1000" height="390" fill="#fff"/>
    <g stroke="#171717" stroke-width="2" fill="#fff">
      <rect x="374" y="22" width="252" height="54" rx="8" fill="#f2f2f2"/>
      <rect x="26" y="185" width="235" height="116" rx="8"/>
      <rect x="374" y="185" width="252" height="116" rx="8" fill="#f2f2f2"/>
      <rect x="739" y="185" width="235" height="116" rx="8"/>
    </g>
    <text x="500" y="57" font-weight="bold">CPU</text>
    <text x="143" y="223" font-weight="bold">SRAM 源数组</text>
    <text x="143" y="264">64 × 32 bit</text>
    <text x="500" y="218" font-weight="bold">RP2040 DMA 通道</text>
    <text x="500" y="253">32 位读写</text>
    <text x="500" y="281">双地址递增</text>
    <text x="857" y="223" font-weight="bold">SRAM 目标数组</text>
    <text x="857" y="264">64 × 32 bit</text>
    <g stroke="#171717" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
      <path d="M 442,76 V 184" stroke-dasharray="7 5"/>
      <path d="M 558,184 V 78" stroke-dasharray="7 5"/>
      <path d="M 261,245 H 372"/>
      <path d="M 626,245 H 737"/>
    </g>
    <text x="357" y="133">配置、启动</text>
    <text x="655" y="133">读取状态</text>
    <text x="318" y="224" font-size="20">读取</text>
    <text x="684" y="224" font-size="20">写入</text>
    <text x="500" y="351">DREQ_FORCE 使能无节拍约束的搬运，启动由软件发起</text>
  </g>
</svg>
